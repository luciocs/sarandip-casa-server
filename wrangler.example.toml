# SPDX-License-Identifier: AGPL-3.0-only
# Copy to wrangler.toml (gitignored) and adjust. Do not put account_id, personal
# URLs or secrets in this file. Set CLOUDFLARE_ACCOUNT_ID in the environment.
# PUBLIC_BASE_URL may be left empty: the Worker then uses the request origin.
name = "sarandip-casa"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ASSISTANT_NAME = "Sarandip"
DEVICE_KIND = "device"
# Must name the model the device firmware was built with: hey_jarvis ("Hey Jarvis", public default),
# okay_nabu ("Okay Nabu") or hey_mycroft ("Hey Mycroft"). A "Hey Sarandip" model is future work, not available yet.
WAKE_WORD = "hey_jarvis"
WAKE_DISPLAY = "Hey Jarvis"
LANGUAGE = "en"
TZ = "UTC"
# "elevenlabs" | "stub"
STT_PROVIDER = "elevenlabs"
ELEVENLABS_STT_MODEL = "scribe_v2"
# "xai" | "stub"
LLM_PROVIDER = "xai"
XAI_MODEL = "grok-4.20-0309-non-reasoning"
XAI_MAX_TOKENS = "160"
XAI_TIMEOUT_MS = "4000"
ESCALATE_MARK = "<<AGENT>>"
# When ROUTINE_PROVIDER is not "off", pre-route calendar/email/tasks/reminders/messages
# to the agent before calling xAI. Default is on. Clock questions stay on the fast path.
ESCALATE_PREROUTE = "true"
# "elevenlabs" | "stub"
TTS_PROVIDER = "elevenlabs"
ELEVENLABS_TTS_MODEL = "eleven_v4_turbo"
ELEVENLABS_TTS_FALLBACK_MODEL = "eleven_flash_v2_5"
# Voice ids are not secret. Leave empty until the owner chooses a voice.
ELEVENLABS_VOICE_ID = ""
TTS_LANGUAGE_CODE = "en"
# "webhook" | "openai" | "anthropic" | "stub" | "off"
# OpenClaw and a Grok Bot routine both use "webhook".
ROUTINE_PROVIDER = "off"
ROUTINE_TIMEOUT_MS = "5000"
# Optional. Default is Authorization: Bearer <WEBHOOK_TOKEN> (what a Grok Bot
# routine webhook expects). Set to another header name to send the raw token in it.
# WEBHOOK_AUTH_HEADER = "authorization"
ACK_TEXT = "On it, I'll get back to you."
ROUTINE_FAIL_TEXT = "I couldn't reach your agent just now."
# If empty, derived from the request origin. Set it when a late-reply webhook
# must call a stable public URL.
PUBLIC_BASE_URL = ""
REPLY_TTL_S = "900"
REPLY_RETRY_MAX = "3"
# Memory is on by default and points at the fictional example repo.
# Skip it with MEMORY_ENABLED = "false". The default example repo is public
# and is read without a token. A private repo still needs GITHUB_TOKEN.
MEMORY_ENABLED = "true"
MEMORY_REPO = "luciocs/jarvis-memory-demo"
MEMORY_PATH = "Agent.md"
MEMORY_REF = "main"
# Comma-separated headings. Defaults match the example Agent.md.
MEMORY_SECTIONS = "## Quem sou,## Família,## Familia,## Tom e formato,### Tom e formato,## Perfil resumido"
MEMORY_MAX_CHARS = "1400"
MEMORY_TTL_S = "600"
MEMORY_FETCH_TIMEOUT_MS = "800"
OPENAI_BASE_URL = "https://api.openai.com/v1"
OPENAI_MODEL = "gpt-4o-mini"
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
ANTHROPIC_MODEL = "claude-sonnet-4-5"
PAIR_RATE_MAX = "10"
PAIR_RATE_WINDOW_S = "300"
# Devices with a code stored on the device (checked by its own setup page) enroll themselves on first pairing.
# "first" = only while the server has no device yet; "open" = any new device id; "off" = admin codes only.
# CLAIM_DEVICE_IDS (comma-separated, e.g. "sc-0123456789ab") limits claims to those ids. Recommended: set it
# to your device id (shown on the device's setup page) so nobody else can claim your server first.
CLAIM_MODE = "first"
CLAIM_DEVICE_IDS = ""
# Welcome audio, played once on the first connection after a (re)pairing.
# "tts" speaks WELCOME_TEXT (empty = default line for LANGUAGE);
# "audio" plays the owner's clip uploaded with PUT /v1/admin/welcome-audio
# (or WELCOME_AUDIO_URL), falling back to the spoken line; "off" disables it.
WELCOME_MODE = "tts"
WELCOME_TEXT = ""
WELCOME_AUDIO_URL = ""
WELCOME_DELAY_MS = "2000"

[[durable_objects.bindings]]
name = "DEVICE_HUB"
class_name = "DeviceHub"

[[durable_objects.bindings]]
name = "DEVICE_REGISTRY"
class_name = "DeviceRegistry"

[[durable_objects.bindings]]
name = "FIRMWARE_STORE"
class_name = "FirmwareStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceHub", "DeviceRegistry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FirmwareStore"]

[observability]
enabled = true
